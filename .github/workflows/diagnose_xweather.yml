name: Diagnose Xweather API Capabilities

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: List all Xweather models
        env:
          XWEATHER_CLIENT_ID: ${{ secrets.XWEATHER_CLIENT_ID }}
          XWEATHER_CLIENT_SECRET: ${{ secrets.XWEATHER_CLIENT_SECRET }}
        run: |
          python3 - << 'EOF'
          import os, json, urllib.request

          cid = os.environ['XWEATHER_CLIENT_ID']
          sec = os.environ['XWEATHER_CLIENT_SECRET']
          url = f"https://data.api.xweather.com/models/catalog?client_id={cid}&client_secret={sec}"
          with urllib.request.urlopen(url, timeout=15) as r:
              data = json.loads(r.read().decode())
              models = data['response'][0]['models']
              print(f"Total models: {len(models)}")
              for m in models:
                  print(f" - {m.get('name')} | region={m.get('region')} | latest={m.get('latestRuntime')} | range={m.get('forecastRange')}")
          EOF
