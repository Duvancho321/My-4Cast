name: WeatherNext 3 Colombia Cropper

on:
  schedule:
    # 00:15, 06:15, 12:15, 18:15 UTC
    - cron: '15 0,6,12,18 * * *'
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Identificador de la corrida (o auto para la mas reciente)'
        required: false
        default: 'auto'

permissions:
  contents: write

jobs:
  crop_and_release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free up runner disk space
        run: |
          echo "=== Espacio antes de limpieza ==="
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo docker system prune --all --force 2>/dev/null || true
          echo "=== Espacio liberado exitosamente ==="
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Google Application Default Credentials
        env:
          GCP_ADC: ${{ secrets.GCP_ADC }}
        run: |
          mkdir -p "$HOME/.config/gcloud"
          echo "$GCP_ADC" > "$HOME/.config/gcloud/application_default_credentials.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/.config/gcloud/application_default_credentials.json" >> $GITHUB_ENV

      - name: Crop Colombia from WeatherNext 3 GCS
        run: |
          python scripts/cloud_crop_colombia.py "${{ github.event.inputs.run_id || 'auto' }}"
          split -b 1000M -d colombia_latest.zip colombia_part_
          rm -f colombia_*.zip

      - name: Publish to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_TAG="colombia-wn3-latest"
          gh release delete "$RUN_TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$RUN_TAG" colombia_part_* \
            --title "WeatherNext 3 Colombia - $(date -u '+%Y-%m-%d %H:%M UTC')" \
            --notes "Recorte automatico para Colombia (15 variables fisicas seleccionadas) generado en GitHub Actions." \
            --latest
