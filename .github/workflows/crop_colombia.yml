name: WeatherNext 3 Colombia Cropper

on:
  schedule:
    # Cada 3 horas a minuto 20 UTC (cubre la llegada de 00, 06, 12, 18 UTC)
    - cron: '20 */3 * * *'
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Identificador de la corrida (o auto para la mas reciente)'
        required: false
        default: 'auto'

permissions:
  contents: write

jobs:
  crop_and_release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free up runner disk space
        run: |
          echo "=== Espacio antes de limpieza ==="
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo docker system prune --all --force 2>/dev/null || true
          echo "=== Espacio liberado exitosamente ==="
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Google Application Default Credentials
        env:
          GCP_ADC: ${{ secrets.GCP_ADC }}
        run: |
          mkdir -p "$HOME/.config/gcloud"
          echo "$GCP_ADC" > "$HOME/.config/gcloud/application_default_credentials.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/.config/gcloud/application_default_credentials.json" >> $GITHUB_ENV

      - name: Crop Colombia from WeatherNext 3 GCS
        id: crop_colombia
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/cloud_crop_colombia.py "${{ github.event.inputs.run_id || 'auto' }}"
          if [ -f colombia_latest.zip ]; then
            split -b 1000M -d colombia_latest.zip colombia_part_
            rm -f colombia_*.zip
            echo "has_new_run=true" >> $GITHUB_OUTPUT
          else
            echo "has_new_run=false" >> $GITHUB_OUTPUT
            echo "No hay nueva corrida para publicar."
          fi

      - name: Publish to GitHub Release
        if: steps.crop_colombia.outputs.has_new_run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_TAG="colombia-wn3-latest"
          RUN_ID=$(python -c "import json; print(json.load(open('manifest.json'))['run_id'])" 2>/dev/null || echo "latest")
          gh release delete "$RUN_TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$RUN_TAG" colombia_part_* manifest.json \
            --title "WeatherNext 3 Colombia - $RUN_ID" \
            --notes "Recorte automatico para Colombia: corrida $RUN_ID con 15 variables fisicas seleccionadas." \
            --latest
