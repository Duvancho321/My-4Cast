name: Backfill Colombia WeatherNext 3

on:
  workflow_dispatch:
    inputs:
      runs:
        description: 'JSON array of run_ids'
        required: true
        default: '["20261101_00hr_01_preds"]'
      mode:
        description: 'Modo de recorte (all o 5km)'
        required: false
        default: 'all'

permissions:
  contents: write

jobs:
  backfill:
    name: Backfill ${{ matrix.run_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        run_id: ${{ fromJson(github.event.inputs.runs) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Free up runner disk space
        run: |
          echo "=== Espacio antes de limpieza ==="
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo docker system prune --all --force 2>/dev/null || true
          echo "=== Espacio liberado exitosamente ==="
          df -h /

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Google Application Default Credentials
        env:
          GCP_ADC_JSON: ${{ secrets.GCP_ADC }}
        run: |
          mkdir -p "$HOME/.config/gcloud"
          echo "$GCP_ADC_JSON" > "$HOME/.config/gcloud/application_default_credentials.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/.config/gcloud/application_default_credentials.json" >> $GITHUB_ENV

      - name: Crop Colombia from WeatherNext 3 GCS
        env:
          RUN_ID: ${{ matrix.run_id }}
          CROP_MODE: ${{ github.event.inputs.mode || 'all' }}
        run: |
          python scripts/cloud_crop_colombia.py "$RUN_ID" "$CROP_MODE"
          split -b 1000M -d colombia_latest.zip colombia_part_
          rm -f colombia_*.zip

      - name: Publish Run to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ matrix.run_id }}
          CROP_MODE: ${{ github.event.inputs.mode || 'all' }}
        run: |
          if [ "$CROP_MODE" = "5km" ]; then
            RUN_TAG="colombia-5km-$RUN_ID"
          else
            RUN_TAG="colombia-$RUN_ID"
          fi
          gh release delete "$RUN_TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$RUN_TAG" colombia_part_* manifest.json \
            --title "WeatherNext 3 Colombia ($CROP_MODE) - $RUN_ID" \
            --notes "Recorte automatico para Colombia ($CROP_MODE) de corrida historica $RUN_ID."
